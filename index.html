<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14452f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d2b1e" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Hold oversikt over julegaver, budsjett og hva som er kjøpt." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Julegavelisten</title>
    <script>
      // Sett valgt tema før siden tegnes (unngår blink). Se src/theme.ts.
      try {
        var t = localStorage.getItem('julegavelisten:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
